<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT API Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      background: #14141a;
      border-radius: 16px;
      border: 1px solid #2a2a35;
      padding: 30px;
    }
    h1 { font-size: 28px; margin-bottom: 4px; background: linear-gradient(135deg, #00d4ff, #7b2ffc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
    .card { background: #1a1a24; border-radius: 12px; padding: 20px; border: 1px solid #2a2a35; margin-bottom: 20px; }
    .card label { display: block; font-size: 13px; font-weight: 600; color: #aaa; margin-bottom: 6px; }
    textarea, input[type="text"] { width: 100%; background: #0d0d14; border: 1px solid #2a2a35; border-radius: 8px; color: #e0e0e0; padding: 12px 14px; font-size: 14px; font-family: inherit; transition: border-color 0.2s; }
    textarea:focus, input:focus { outline: none; border-color: #7b2ffc; }
    textarea { min-height: 80px; resize: vertical; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .row button { background: linear-gradient(135deg, #7b2ffc, #00d4ff); border: none; color: white; padding: 12px 32px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
    .row button:hover:not(:disabled) { transform: scale(1.02); opacity: 0.9; }
    .row button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .options { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px; }
    .options label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aaa; cursor: pointer; }
    .options input[type="checkbox"] { accent-color: #7b2ffc; width: 16px; height: 16px; cursor: pointer; }
    .file-upload { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .file-upload label { background: #1f1f2b; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid #2a2a35; }
    .file-upload label:hover { background: #2a2a3a; }
    #file-name { font-size: 13px; color: #888; }
    #response { background: #0d0d14; border: 1px solid #2a2a35; border-radius: 8px; padding: 16px; min-height: 120px; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.6; margin-top: 12px; max-height: 400px; overflow-y: auto; }
    .meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #666; margin-top: 8px; }
    .meta span { background: #1a1a24; padding: 2px 10px; border-radius: 12px; border: 1px solid #2a2a35; }
    .history-item { padding: 8px 12px; margin: 4px 0; border-radius: 6px; background: #1a1a24; border-left: 3px solid #7b2ffc; }
    .history-item.user { border-left-color: #00d4ff; }
    .history-item .role { font-weight: 600; font-size: 12px; color: #888; }
    .history-item .content { margin-top: 2px; }
    #history-container { max-height: 200px; overflow-y: auto; margin-top: 8px; }
    .clear-btn { background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 12px; text-decoration: underline; }
    .status { font-size: 13px; color: #aaa; margin-left: 10px; }
  </style>
</head>
<body>
<div class="container">
  <h1>🧠 ChatGPT API Test</h1>
  <div class="sub">All features: text, image, web search, streaming, history, system instructions</div>

  <div class="card">
    <label>System Instruction (optional)</label>
    <input type="text" id="instruction" placeholder="e.g. Respond like a pirate" value="">

    <label style="margin-top:12px;">Your Message</label>
    <textarea id="message" placeholder="Type your message...">What is the capital of France?</textarea>

    <div class="row" style="margin-top:12px;">
      <button id="sendBtn">Send</button>
      <button id="streamBtn" style="background: linear-gradient(135deg, #ff6b6b, #ee5a24);">Stream</button>
      <span id="status" class="status"></span>
    </div>

    <div class="options">
      <label><input type="checkbox" id="webSearch"> Web Search</label>
      <div class="file-upload">
        <label for="imageInput">📷 Upload Image</label>
        <input type="file" id="imageInput" accept="image/*">
        <span id="file-name">No file</span>
        <button id="clearImage" style="background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:12px;">✕</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label style="margin:0;">Conversation History</label>
      <button id="clearHistory" class="clear-btn">Clear</button>
    </div>
    <div id="history-container"></div>
  </div>

  <div class="card">
    <label>Response</label>
    <div id="response">Waiting for response...</div>
    <div class="meta">
      <span id="meta-model">Model: -</span>
      <span id="meta-conv">Conversation ID: -</span>
      <span id="meta-msg">Message ID: -</span>
    </div>
  </div>
</div>

<script>
  const messageEl = document.getElementById('message');
  const instructionEl = document.getElementById('instruction');
  const sendBtn = document.getElementById('sendBtn');
  const streamBtn = document.getElementById('streamBtn');
  const statusEl = document.getElementById('status');
  const responseEl = document.getElementById('response');
  const webSearchEl = document.getElementById('webSearch');
  const imageInput = document.getElementById('imageInput');
  const fileName = document.getElementById('file-name');
  const clearImage = document.getElementById('clearImage');
  const historyContainer = document.getElementById('history-container');
  const clearHistoryBtn = document.getElementById('clearHistory');
  const metaModel = document.getElementById('meta-model');
  const metaConv = document.getElementById('meta-conv');
  const metaMsg = document.getElementById('meta-msg');

  let history = [];
  let conversationId = null;
  let messageId = null;
  let currentImage = null; // base64

  // Load history from localStorage
  function loadHistory() {
    try {
      const saved = localStorage.getItem('chat_history');
      if (saved) history = JSON.parse(saved);
      renderHistory();
    } catch {}
  }
  function saveHistory() {
    localStorage.setItem('chat_history', JSON.stringify(history));
  }

  function renderHistory() {
    historyContainer.innerHTML = history.map(item => `
      <div class="history-item ${item.role}">
        <div class="role">${item.role === 'user' ? '👤 You' : '🤖 Assistant'}</div>
        <div class="content">${item.content}</div>
      </div>
    `).join('');
    historyContainer.scrollTop = historyContainer.scrollHeight;
  }

  function addHistory(role, content) {
    history.push({ role, content });
    if (history.length > 50) history.shift();
    saveHistory();
    renderHistory();
  }

  clearHistoryBtn.addEventListener('click', () => {
    history = [];
    saveHistory();
    renderHistory();
    conversationId = null;
    messageId = null;
    metaConv.textContent = 'Conversation ID: -';
    metaMsg.textContent = 'Message ID: -';
  });

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) { fileName.textContent = 'No file'; currentImage = null; return; }
    fileName.textContent = file.name;
    const reader = new FileReader();
    reader.onload = (ev) => {
      currentImage = ev.target.result; // base64
    };
    reader.readAsDataURL(file);
  });
  clearImage.addEventListener('click', () => {
    imageInput.value = '';
    fileName.textContent = 'No file';
    currentImage = null;
  });

  async function sendMessage(stream = false) {
    const message = messageEl.value.trim();
    if (!message) { statusEl.textContent = '⚠️ Message empty'; return; }
    const instruction = instructionEl.value.trim();
    const webSearch = webSearchEl.checked;

    const payload = {
      message,
      instruction: instruction || undefined,
      history: history.map(h => ({ role: h.role, content: h.content })),
      webSearch,
      stream,
      image: currentImage || undefined
    };

    const url = '/api/chat';
    const options = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    };

    sendBtn.disabled = streamBtn.disabled = true;
    statusEl.textContent = stream ? '🔄 Streaming...' : '⏳ Sending...';
    responseEl.textContent = '';

    try {
      if (stream) {
        const resp = await fetch(url, options);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let full = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.slice(6));
              if (data.done) {
                responseEl.textContent = data.full || full;
                if (data.model) metaModel.textContent = 'Model: ' + data.model;
                if (data.conversationId) { conversationId = data.conversationId; metaConv.textContent = 'Conversation ID: ' + data.conversationId; }
                if (data.messageId) { messageId = data.messageId; metaMsg.textContent = 'Message ID: ' + data.messageId; }
                addHistory('assistant', data.full || full);
                statusEl.textContent = '✅ Done';
                break;
              } else {
                full = data.full || full + (data.chunk || '');
                responseEl.textContent = full;
              }
            }
          }
        }
      } else {
        const resp = await fetch(url, options);
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Request failed');
        responseEl.textContent = data.text || 'No response';
        if (data.model) metaModel.textContent = 'Model: ' + data.model;
        if (data.conversationId) { conversationId = data.conversationId; metaConv.textContent = 'Conversation ID: ' + data.conversationId; }
        if (data.messageId) { messageId = data.messageId; metaMsg.textContent = 'Message ID: ' + data.messageId; }
        addHistory('assistant', data.text || 'No response');
        statusEl.textContent = '✅ Done';
      }
    } catch (err) {
      statusEl.textContent = '❌ Error: ' + err.message;
      responseEl.textContent = 'Error: ' + err.message;
    } finally {
      sendBtn.disabled = streamBtn.disabled = false;
      if (!stream) statusEl.textContent = '✅ Done';
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(false));
  streamBtn.addEventListener('click', () => sendMessage(true));

  // Enter to send
  messageEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(false);
    }
  });

  loadHistory();
</script>
</body>
</html>
